name: Build Windows app

# HYUNLAB Memo Windows 설치 파일을 자동으로 빌드합니다.
#  - 태그(v*)를 push하면: 빌드 후 GitHub Release에 설치 파일을 첨부합니다.
#  - 수동 실행(workflow_dispatch)도 가능합니다. 이 경우 Release에는 올리지 않고
#    Actions의 "Artifacts"로만 결과물을 남깁니다 (빌드가 잘 되는지 확인용).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win

      - name: Find built installer
        id: find
        shell: bash
        run: |
          FILE=$(find release -maxdepth 2 -name '*.exe' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "설치 파일을 찾지 못했습니다." >&2
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HYUNLAB-Memo-windows
          path: ${{ steps.find.outputs.path }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
